services:
  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/glance/config:/app/config
      - /opt/glance/assets:/app/assets
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glance.entrypoints=http"
      - "traefik.http.routers.glance.rule=Host(`glance.rataiczak.com`)"
      - "traefik.http.routers.glance.middlewares=traefik-https-redirect"
      - "traefik.http.routers.glance-secure.entrypoints=https"
      - "traefik.http.routers.glance-secure.rule=Host(`glance.rataiczak.com`)"
      - "traefik.http.routers.glance-secure.tls=true"
      - "traefik.http.routers.glance-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.glance-secure.middlewares=default-headers@docker"
      - "traefik.http.routers.glance-secure.service=glance"
      - "traefik.http.services.glance.loadbalancer.server.port=8080"
    networks:
      - proxy

networks:
  proxy:
    external: true
