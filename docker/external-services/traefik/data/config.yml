http:

  routers:
    proxmox:
      entryPoints:
        - https
      rule: "Host(`proxmox.rataiczak.com`)"
      tls: {}
      service: proxmox
      middlewares:
        - proxmox-headers
    
    uptime:
      entryPoints:
        - https
      rule: "Host(`uptime.rataiczak.com`)"
      tls: {}
      service: uptime
      middlewares:
        - default-headers

  services:
    proxmox:
      loadBalancer:
        servers:
          - url: "https://10.0.20.3:8006"
        passHostHeader: true

    uptime:
      loadBalancer:
        servers:
          - url: "http://10.0.20.5:3001"
        passHostHeader: true

  middlewares:
    default-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsSeconds: 15552000
        stsIncludeSubdomains: true
        stsPreload: true
        customRequestHeaders:
          X-Forwarded-Proto: https

    proxmox-headers:
      headers:
        frameDeny: false
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsSeconds: 15552000
        stsIncludeSubdomains: true
        stsPreload: true
        customRequestHeaders:
          X-Forwarded-Proto: https
