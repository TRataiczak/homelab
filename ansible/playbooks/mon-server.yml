---
# RAT-MON-01 configuration playbook
# Deploys monitoring stack - Prometheus, Grafana, Loki, Uptime Kuma
# Usage: ansible-playbook playbooks/mon-server.yml --limit RAT-MON-01

- name: Configure RAT-MON-01
  hosts: RAT-MON-01
  become: yes

  tasks:

    - name: Install Docker dependencies
      dnf:
        name:
          - dnf-plugins-core
        state: present
        update_cache: yes

    - name: Add Docker repo
      command: dnf config-manager addrepo --from-repofile=https://download.docker.com/linux/fedora/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Install Docker
      dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Enable and start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add tj to docker group
      user:
        name: tj
        groups: docker
        append: yes

    - name: Add ansible to docker group
      user:
        name: ansible
        groups: docker
        append: yes

    - name: Create Docker monitoring network
      community.docker.docker_network:
        name: monitoring
        state: present

    - name: Create Uptime Kuma directory
      file:
        path: /opt/monitoring/uptime-kuma/data
        state: directory
        owner: tj
        group: tj
        mode: '0755'

    - name: Copy Uptime Kuma compose file
      copy:
        src: ../../docker/monitoring/uptime-kuma/docker-compose.yml
        dest: /opt/monitoring/uptime-kuma/docker-compose.yml
        owner: tj
        group: tj

    - name: Start Uptime Kuma
      community.docker.docker_compose_v2:
        project_src: /opt/monitoring/uptime-kuma
        state: present
